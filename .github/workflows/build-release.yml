name: Build and Release Executable

permissions:
  contents: write

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  sanity-check:
    name: Sanity Check
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile all sources
        shell: bash
        run: python -m py_compile gui/*.py gui/session_browser/*.py packing_tool/*.py shared/*.py main.py

      - name: Import main module
        run: python -c "import main"

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: sanity-check
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: pyinstaller main.spec

      - name: Verify bundled assets shipped
        # A missing gui/assets does not degrade: icon() raises during
        # MainWindow construction, and --windowed means the user double-clicks
        # an exe that silently never opens.
        shell: pwsh
        run: |
          foreach ($name in "package.svg", "Inter-Regular.ttf") {
            if (-not (Get-ChildItem -Path "dist\Packers-Assistant" -Recurse -Filter $name)) {
              throw "PyInstaller did not bundle $name -- the app would not start."
            }
          }

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Packers-Assistant\*" -DestinationPath "Packers-Assistant-v${{ github.ref_name }}.zip"

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Packers-Assistant-v${{ github.ref_name }}.zip
          asset_name: Packers-Assistant-v${{ github.ref_name }}.zip
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
