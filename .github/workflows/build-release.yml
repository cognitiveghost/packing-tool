name: Build and Release Executable

permissions:
  contents: write

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  sanity-check:
    # Tests were removed for a rewrite (not present in this checkout). Until they're
    # back, this just checks the source tree compiles and imports cleanly.
    name: Sanity Check
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m py_compile src/*.py src/session_browser/*.py shared/*.py

      - name: Import main module
        working-directory: src
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import main"

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: sanity-check
    if: github.event_name == 'release'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: pyinstaller main.spec

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/Packers-Assistant.exe
          asset_name: Packers-Assistant-v${{ github.ref_name }}.exe
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
